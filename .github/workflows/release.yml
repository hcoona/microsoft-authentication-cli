name: Release

# Builds a 0.1.0-alpha prerelease of azureauth-unofficial from main-v2 and creates a
# draft GitHub prerelease. The repository owner reviews and publishes each draft by hand.
# docs/delivery-wave.md ("Windows 0.1.0-alpha Prereleases") authorizes this workflow and
# bounds its permissions, assets and effects; the Windows design owns the package.

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  # The mise version CI pins; keep it equal to MISE_VERSION in check.yml.
  MISE_VERSION: 2026.10.22

jobs:
  build:
    name: Build and package
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      MISE_EXEC_AUTO_INSTALL: "false"

    steps:
      - name: Refuse any ref other than main-v2
        if: github.ref != 'refs/heads/main-v2'
        run: |
          Write-Error "Release builds run only from refs/heads/main-v2."
          exit 1

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nerdbank.GitVersioning computes the product version from the full history.
          fetch-depth: 0
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ env.MISE_VERSION }}
          install: false
          # Never restore a cache into a release build.
          cache: false

      - name: Install the pinned .NET SDK
        run: mise install --locked http:dotnet-development

      - name: Restore with the committed lock files
        run: mise exec -- dotnet restore Windows.slnx --locked-mode

      - name: Build
        run: mise exec -- dotnet build Windows.slnx --configuration Release --no-restore

      - name: Create a fresh scenario temporary directory
        run: New-Item -ItemType Directory -Path "${{ runner.temp }}\scenarios"

      - name: Run the Windows synthetic scenarios without host-timing assertions
        run: >-
          mise exec -- dotnet
          tests/Authentication.Windows.Scenarios/bin/Release/net10.0-windows/Authentication.Windows.Scenarios.dll
          --filter "TestCategory!=WindowsHostTiming"
        env:
          TEMP: ${{ runner.temp }}\scenarios
          TMP: ${{ runner.temp }}\scenarios

      - name: Package
        run: >-
          mise exec -- pwsh -NoProfile -File packaging/windows/package.ps1
          -OutputDirectory "${{ runner.temp }}\package"

      - name: Record the version and the build chain
        id: version
        env:
          PACKAGE: ${{ runner.temp }}\package
        run: |
          $zip = @(Get-ChildItem -LiteralPath $env:PACKAGE -Filter 'azureauth-unofficial-*-win-x64.zip')
          if ($zip.Count -ne 1) { throw "expected one package zip, found $($zip.Count)" }
          if ($zip[0].Name -notmatch '^azureauth-unofficial-(0\.1\.0-alpha\.(0|[1-9][0-9]*))-win-x64\.zip$') {
            throw "unexpected package name $($zip[0].Name)"
          }
          $version = $Matches[1]
          $commit = (git rev-parse HEAD).Trim()
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          # The ILCompiler package finds Visual Studio with vswhere -latest -prerelease; match it.
          $vsArgs = @('-latest', '-prerelease', '-products', '*', '-requires', 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64')
          $vs = & $vswhere @vsArgs -property installationPath
          $vsVersion = & $vswhere @vsArgs -property catalog_productDisplayVersion
          $msvc = (Get-Content -LiteralPath (Join-Path $vs 'VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt')).Trim()
          $link = (Get-Item -LiteralPath (Join-Path $vs "VC\Tools\MSVC\$msvc\bin\Hostx64\x64\link.exe")).VersionInfo.FileVersion
          $kits = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Lib'
          $sdks = @(Get-ChildItem -LiteralPath $kits -Directory |
            Where-Object { Test-Path (Join-Path $_.FullName 'um\x64') } |
            ForEach-Object { $_.Name } | Sort-Object { [version]$_ })
          $info = [ordered]@{
            version = $version
            commit = $commit
            runnerImage = "$env:ImageOS $env:ImageVersion"
            dotnetSdk = (mise exec -- dotnet --version).Trim()
            visualStudio = $vsVersion
            msvc = $msvc
            linkExe = $link
            windowsSdks = $sdks
          }
          $json = $info | ConvertTo-Json
          Set-Content -LiteralPath (Join-Path $env:PACKAGE 'build-info.json') -Value $json
          Write-Host $json
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value @('## Build chain', '', '```json', $json, '```')
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value @("version=$version", "commit=$commit")

      - name: Upload the package for the next jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}\package\*
          if-no-files-found: error
          # The owner accepted at most one day of exposure; nothing deletes them earlier.
          retention-days: 1

  attest:
    name: Attest build provenance
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Download the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package

      - name: Attest both zips
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: package/*.zip

  draft:
    name: Create the draft prerelease
    needs: [build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
      COMMIT: ${{ needs.build.outputs.commit }}
    steps:
      - name: Download the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package

      - name: Verify the checksums and the recorded commit
        working-directory: package
        run: |
          sha256sum --check -- *.sha256
          test "$(jq -r .commit build-info.json)" = "$COMMIT"
          test "$(jq -r .version build-info.json)" = "$VERSION"

      - name: Refuse an existing tag, release or draft
        # bash -eo pipefail, so a failed lookup in a pipeline stops the run.
        shell: bash
        run: |
          # Only a 404 means absent; any other failure stops the run.
          absent() {
            local err
            if err=$(gh api "$1" 2>&1 >/dev/null); then return 1; fi
            if grep -q 'HTTP 404' <<<"$err"; then return 0; fi
            echo "$err" >&2
            exit 1
          }
          absent "repos/$GH_REPO/git/ref/tags/v$VERSION" || { echo "Tag v$VERSION already exists." >&2; exit 1; }
          absent "repos/$GH_REPO/releases/tags/v$VERSION" || { echo "A published release v$VERSION already exists." >&2; exit 1; }
          drafts=$(gh api --paginate "repos/$GH_REPO/releases" --jq "[.[] | select(.tag_name == \"v$VERSION\")] | length" | awk '{ n += $1 } END { print n + 0 }')
          if [ "$drafts" -ne 0 ]; then echo "A release or draft for v$VERSION already exists." >&2; exit 1; fi

      - name: Create the draft prerelease
        run: |
          {
            echo "**azureauth-unofficial $VERSION** is an unsupported alpha prerelease of"
            echo "[AzureAuth Unofficial V2](https://github.com/$GH_REPO), an independent, unofficial"
            echo "fork of Microsoft Authentication CLI. It is not a Microsoft product and has no"
            echo "support, production-readiness or compatibility commitment."
            echo
            echo "- Built from commit $COMMIT by this repository's release workflow. The zips carry"
            echo "  [GitHub build-provenance attestations](https://github.com/$GH_REPO/attestations)."
            echo "- The executables are not code-signed. Compare each zip with its .sha256 file"
            echo "  before extracting."
            echo "- The package bundles the Microsoft-owned Visual Studio public client as an opt-in"
            echo "  Client Profile. Sign-in, consent and audit records show Visual Studio; Microsoft"
            echo "  provides no support or availability commitment for it."
            echo "- The -symbols.zip holds the native and managed symbol files for diagnosing this"
            echo "  build; it is not needed to run it."
            echo
            echo "Read the [package README](https://github.com/$GH_REPO/blob/$COMMIT/packaging/windows/README.md)"
            echo "before use. The release review for this prerelease is recorded on"
            echo "[Issue #506](https://github.com/$GH_REPO/issues/506)."
          } > notes.md
          gh release create "v$VERSION" --draft --prerelease --target "$COMMIT" \
            --title "azureauth-unofficial $VERSION" --notes-file notes.md \
            package/*.zip package/*.sha256
