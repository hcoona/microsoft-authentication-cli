min_version = "2026.10.22"

[tools]
actionlint = "1.7.12"
"github:microsoft/apm" = "v0.29.0"
gitleaks = "8.30.1"
hk = "1.56.1"
lychee = "0.24.2"
node = "22.22.2"
pkl = "0.32.1"
python = "3.13.15"
shellcheck = "0.11.0"
uv = "0.12.7"

[tools."http:dotnet-development"]
version = "10.0.403"

[tools."http:dotnet-development".platforms]
linux-x64 = { url = "https://builds.dotnet.microsoft.com/dotnet/Sdk/10.0.403/dotnet-sdk-10.0.403-linux-x64.tar.gz", checksum = "sha512:b7b3d8461cf98b07d2552ce9199702fa3ad010ac2671a5f8cd5136f7534e50f6855ba7bbb02b11494563f1d04156276a31cda1103b900e5eecd0d9473dc7b9c5" }
windows-x64 = { url = "https://builds.dotnet.microsoft.com/dotnet/Sdk/10.0.403/dotnet-sdk-10.0.403-win-x64.zip", checksum = "sha512:7a114c318fa7f1d9822991b534b2814d0e78386ceda816b371f5141acefe741d87ccb606ede06cadac8f9ac5070e32b708a67bbd1619ff5e5a7858a27874ef48" }

[env]
HK_MISE = "1"

[tasks.check]
description = "Run the complete repository check set"
run = "hk check --all"

[tasks."check:fast"]
description = "Run the local fast check set"
run = "hk run pre-commit"

[tasks."hooks:install"]
description = "Install repository-local Git hooks through mise"
run = "hk install --mise"
