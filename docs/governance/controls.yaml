schema_version: 1

controls:
  - id: repository-hygiene
    state: current
    class: mechanical
    enforcement: blocking
    producer: hk
    maintainer: Control maintainer
    consumers:
      - Contributors at local-fast before commit
      - GitHub Actions and reviewers at CI before merge
    governing_rules:
      - docs/governance/governance-system.md#gov-005-controls-implement-policy
      - docs/governance/record-system.md#record-system-gate
    invariant: Pre-commit checks run only when the worktree matches the staged snapshot, and tracked text has no unresolved conflict markers or whitespace errors.
    runner: hk
    implementation:
      kind: hk-steps
      steps:
        local-fast:
          - staged-worktree-consistency
          - merge-conflict
          - trailing-whitespace
        ci:
          - merge-conflict
          - trailing-whitespace
    execution_points:
      - local-fast
      - ci
    failure_mode: Unstaged or untracked content changes repository-wide check results, or a malformed merge or patch enters review or main-v2.

  - id: markdown-links
    state: current
    class: mechanical
    enforcement: blocking
    producer: hk
    maintainer: Control maintainer
    consumers:
      - Contributors at local-fast before commit
      - GitHub Actions and reviewers at CI before merge
    governing_rules:
      - docs/governance/record-system.md#deletion-and-replacement
    invariant: Internal Markdown links resolve to current repository paths and anchors.
    runner: hk
    implementation:
      kind: hk-steps
      steps:
        local-fast:
          - markdown-links
        ci:
          - markdown-links
    execution_points:
      - local-fast
      - ci
    failure_mode: Navigation or policy references lead to deleted or moved records.

  - id: structured-record-schema
    state: current
    class: mechanical
    enforcement: blocking
    producer: hk and check-jsonschema
    maintainer: Structured-record maintainer
    consumers:
      - Structured-record authors at local-fast
      - GitHub Actions and reviewers at CI before merge
    governing_rules:
      - docs/governance/record-system.md#formats
      - docs/governance/record-system.md#record-system-gate
    invariant: Every active YAML or JSON record validates against its declared schema, and every active JSON Schema validates against its metaschema.
    runner: hk
    implementation:
      kind: hk-steps
      steps:
        local-fast:
          - structured-record-schema
        ci:
          - structured-record-schema
    execution_points:
      - local-fast
      - ci
    failure_mode: A structured record becomes ambiguous or unreadable by its consumer.

  - id: public-build-source-audit-consistency
    state: current
    class: mechanical
    enforcement: blocking
    producer: hk and the repository record checker
    maintainer: Research maintainer
    consumers:
      - Repository checker and research maintainers when preserving the fixed source baseline and Lasso manifest
      - Research reviewers when validating recorded public-build conclusions or a proposed correction, replay, or migration
    governing_rules:
      - docs/research/experiment-safety.md#phase-1-public-build-record
      - docs/governance/record-system.md#record-system-gate
    invariant: The current public-build source baseline and Lasso manifest retain canonical source identity, hashes, identifiers, ordering, and cross-record consistency under duplicate-rejecting JSON parsing, and a small static fixture set verifies recorded-bundle source binding, command topology, isolation principles, and exact extractor replay without executing the subject.
    runner: hk
    implementation:
      kind: hk-steps
      steps:
        local-fast:
          - structured-record-schema
        ci:
          - structured-record-schema
    execution_points:
      - local-fast
      - ci
    failure_mode: A fixed-source authority, planned-bundle contract, or retained synthetic assets projection becomes internally inconsistent while still passing schema validation.

  - id: public-build-evidence-consistency
    state: current
    class: mechanical
    enforcement: blocking
    producer: hk and the repository record checker
    maintainer: Research maintainer
    consumers:
      - Repository checker and research reviewers when validating the recorded result
      - Research reviewers when evaluating the public-build conclusion
    governing_rules:
      - docs/research/experiment-safety.md#phase-1-public-build-record
    invariant: The recorded singleton remains strict, filename-bound, source- and component-bound, within its historical host and safety ceilings, and internally consistent with the fixed two-mode non-publishing Issue #1 execution. Its retained command evidence, shared-reducer result, bounded sanitized output, all-exit quiescence, source integrity, dependency extraction, receipt, and recording lifecycle remain reproducible without granting authority for another run.
    runner: hk
    implementation:
      kind: hk-steps
      steps:
        local-fast:
          - structured-record-schema
          - public-build-runner-conformance
        ci:
          - structured-record-schema
          - public-build-runner-conformance
    execution_points:
      - local-fast
      - ci
    failure_mode: The recorded result becomes inconsistent or unreproducible, blockers or conclusions contradict primitive evidence, retained output or assets violate their safety boundary, lifecycle evidence loses its source or component binding, a hash-bound component drifts without the required replay-or-migration decision, or repository validation accepts evidence that the retained validator rejects.

  - id: requirement-id-uniqueness
    state: current
    class: mechanical
    enforcement: blocking
    producer: hk and the repository record checker
    maintainer: Product-record maintainer
    consumers:
      - Requirement authors at local-fast
      - GitHub Actions and reviewers at CI before merge
    governing_rules:
      - docs/governance/record-system.md#workflows
    invariant: Each established V2 requirement identifier remains defined exactly once as an active nonempty requirement or an explicit retirement marker naming its current authority.
    runner: hk
    implementation:
      kind: hk-steps
      steps:
        local-fast:
          - record-identifiers
        ci:
          - record-identifiers
    execution_points:
      - local-fast
      - ci
    failure_mode: Requirements become ambiguous across capability modules, disappear, or remain as empty retirement placeholders.

  - id: decision-number-uniqueness
    state: current
    class: mechanical
    enforcement: blocking
    producer: hk and the repository record checker
    maintainer: Decision-record maintainer
    consumers:
      - Decision authors at local-fast
      - GitHub Actions and reviewers at CI before merge
    governing_rules:
      - docs/governance/record-system.md#lifecycle-through-git-and-github
    invariant: Each decision record number and file prefix is unique.
    runner: hk
    implementation:
      kind: hk-steps
      steps:
        local-fast:
          - record-identifiers
        ci:
          - record-identifiers
    execution_points:
      - local-fast
      - ci
    failure_mode: Durable decisions cannot be referenced unambiguously.

  - id: record-family-path-consistency
    state: current
    class: mechanical
    enforcement: blocking
    producer: hk and the repository record checker
    maintainer: Record-system maintainer
    consumers:
      - Record authors and reviewers at local-fast and CI
    governing_rules:
      - docs/governance/governance-system.md#gov-002-one-canonical-authority
      - docs/governance/record-system.md#authority-by-concern
    invariant: Current record-family paths exist, governed records match one declared family, and the documentation portal routes to every retained current record.
    runner: hk
    implementation:
      kind: hk-steps
      steps:
        local-fast:
          - record-family-path-consistency
        ci:
          - record-family-path-consistency
    execution_points:
      - local-fast
      - ci
    failure_mode: A canonical record is orphaned, duplicated, or omitted from review routing.

  - id: secret-shape
    state: current
    class: mechanical
    enforcement: blocking
    producer: hk and gitleaks
    maintainer: Security maintainer
    consumers:
      - Contributors at local-fast before commit
      - GitHub Actions and reviewers at CI before merge
    governing_rules:
      - docs/governance/project.md
      - docs/research/experiment-safety.md
    invariant: Committed content does not match configured credential or secret patterns.
    runner: hk
    implementation:
      kind: hk-steps
      steps:
        local-fast:
          - gitleaks
        ci:
          - gitleaks
          - gitleaks-history
    execution_points:
      - local-fast
      - ci
    failure_mode: Credentials or private experimental data enter Git history.

  - id: github-workflow-validation
    state: current
    class: mechanical
    enforcement: blocking
    producer: hk and actionlint
    maintainer: Control maintainer
    consumers:
      - GitHub Actions maintainers and reviewers at CI
    governing_rules:
      - docs/governance/governance-system.md#gov-005-controls-implement-policy
    invariant: GitHub Actions workflows satisfy their published syntax and expression contracts.
    runner: hk
    implementation:
      kind: hk-steps
      steps:
        ci:
          - actionlint
    execution_points:
      - ci
    failure_mode: The repository merges a workflow that cannot execute its declared checks.

  - id: record-system-review
    state: current
    class: procedural-review
    enforcement: review-required
    producer: Reviewer independent of the change author and implementation agent
    maintainer: Record-system maintainer
    consumers:
      - Change author and repository owner during pull-request and Delivery Wave review
    governing_rules:
      - docs/governance/governance-system.md
      - docs/governance/record-system.md
    invariant: Changed record families and current work authorization retain one authority, real consumers, bounded lifecycle, and policy-aligned controls.
    runner: agent-skill
    implementation:
      kind: repository-path
      value: .github/skills/record-system-review/SKILL.md
    execution_points:
      - pull-request-review
    failure_mode: A syntactically valid change creates duplicated authority or unmaintainable governance.

  - id: research-evidence-review
    state: current
    class: procedural-review
    enforcement: review-required
    producer: Reviewer independent of the change author and implementation agent
    maintainer: Research maintainer
    consumers:
      - Change author and repository owner during research, every Delivery Wave change, recheck-trigger, and release review
    governing_rules:
      - docs/research/experiment-safety.md
      - docs/governance/record-system.md
    invariant: Research changes preserve source boundaries, bounded effects, accepted protocols, evidence labels, reproducibility, and claim limits; every merged Delivery Wave change and fired trigger evaluates the current recheck registry.
    runner: agent-skill
    implementation:
      kind: repository-path
      value: .github/skills/research-evidence-review/SKILL.md
    execution_points:
      - pull-request-review
      - recheck-trigger
      - release
    failure_mode: Research conclusions overstate evidence or expose unsafe experimental detail.

  - id: independent-finding-triage
    state: current
    class: procedural-review
    enforcement: review-required
    producer: Reviewer independent of the originating review, change author, and implementation agent
    maintainer: Repository owner
    consumers:
      - Change author and repository owner before remediation or disposition
    governing_rules:
      - docs/governance/governance-system.md#gov-011-separate-findings-from-disposition
    invariant: A reviewer does not solely validate or dismiss its own material findings.
    runner: agent-skill
    implementation:
      kind: review-procedure
      value: Material-finding triage instructions in each active review Skill
    execution_points:
      - pull-request-review
      - recheck-trigger
      - release
    failure_mode: A self-confirming review creates false assurance or unnecessary changes.

  - id: record-system-gate
    state: current
    class: owner-decision
    enforcement: owner-disposition
    producer: Repository owner
    maintainer: Repository owner
    consumers:
      - Repository owner at the applicable pull-request merge
    governing_rules:
      - docs/governance/record-system.md#record-system-gate
      - docs/governance/governance-system.md#gov-010-gates-require-evidence
    invariant: A record-system or work-authorization change is accepted only after its required mechanical and contextual evidence is reviewable.
    runner: human-owner
    implementation:
      kind: evidence-carrier
      value: Applicable pull request, check results, review records, and owner disposition
    execution_points:
      - pull-request-merge
    failure_mode: The repository accepts changed authority or work authorization without evidence that its records and controls agree.
