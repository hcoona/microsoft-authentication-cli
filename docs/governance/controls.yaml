schema_version: 1

controls:
  - id: repository-hygiene
    state: current
    class: mechanical
    enforcement: blocking
    producer: hk
    maintainer: Control maintainer
    consumers:
      - Contributors at local-fast before commit
      - GitHub Actions and reviewers at CI before merge
    governing_rules:
      - docs/governance/governance-system.md#gov-005-controls-implement-policy
      - docs/governance/record-system.md#record-system-gate
      - docs/governance/record-system.md#formats
    invariant: >-
      Pre-commit checks run only when the worktree matches the staged snapshot, and
      tracked text has no unresolved conflict markers or whitespace errors. The generated
      CRLF dependency lock paths named in the trailing-whitespace step retain their
      generator bytes instead of undergoing whitespace rewriting; review of a regenerated
      lock, not hk, establishes its content. All other applicable checks still include
      them.
    runner: hk
    implementation:
      kind: hk-steps
      steps:
        local-fast:
          - staged-worktree-consistency
          - merge-conflict
          - trailing-whitespace
        ci:
          - merge-conflict
          - trailing-whitespace
    execution_points:
      - local-fast
      - ci
    failure_mode: Unstaged or untracked content changes repository-wide check results, or a malformed merge or patch enters review or main-v2.

  - id: markdown-links
    state: current
    class: mechanical
    enforcement: blocking
    producer: hk
    maintainer: Control maintainer
    consumers:
      - Contributors at local-fast before commit
      - GitHub Actions and reviewers at CI before merge
    governing_rules:
      - docs/governance/record-system.md#deletion-and-replacement
    invariant: Internal Markdown links resolve to current repository paths and anchors.
    runner: hk
    implementation:
      kind: hk-steps
      steps:
        local-fast:
          - markdown-links
        ci:
          - markdown-links
    execution_points:
      - local-fast
      - ci
    failure_mode: Navigation or policy references lead to deleted or moved records.

  - id: structured-record-schema
    state: current
    class: mechanical
    enforcement: blocking
    producer: hk and check-jsonschema
    maintainer: Structured-record maintainer
    consumers:
      - Structured-record authors at local-fast
      - GitHub Actions and reviewers at CI before merge
    governing_rules:
      - docs/governance/record-system.md#formats
      - docs/governance/record-system.md#record-system-gate
    invariant: Every active YAML or JSON record validates against its declared schema, and every active JSON Schema validates against its metaschema.
    runner: hk
    implementation:
      kind: hk-steps
      steps:
        local-fast:
          - structured-record-schema
        ci:
          - structured-record-schema
    execution_points:
      - local-fast
      - ci
    failure_mode: A structured record becomes ambiguous or unreadable by its consumer.

  - id: public-build-evidence-consistency
    state: current
    class: mechanical
    enforcement: blocking
    producer: hk and the repository record checker
    maintainer: Research maintainer
    consumers:
      - Repository checker and research maintainers when preserving the fixed source baseline, Lasso manifest, and frozen Issue 1 evidence
      - Research reviewers when relying on or correcting the recorded public-build conclusions
    governing_rules:
      - docs/governance/record-system.md#formats
      - docs/governance/record-system.md#record-system-gate
    invariant: >-
      The public-build source baseline and Lasso manifest retain canonical source
      identity, hashes, identifiers, ordering, and cross-record consistency under
      duplicate-rejecting JSON parsing. The recorded Issue 1 bundle is frozen evidence:
      its bytes match the digest pinned in the repository checker, it binds both source
      authorities by hash, and the retained asset files are exactly the ones it
      references, with matching hashes.
    runner: hk
    implementation:
      kind: hk-steps
      steps:
        local-fast:
          - structured-record-schema
        ci:
          - structured-record-schema
    execution_points:
      - local-fast
      - ci
    failure_mode: A fixed-source authority or the frozen recorded evidence is silently edited, loses or gains a retained asset, or stops matching the source authorities it binds.

  - id: requirement-id-uniqueness
    state: current
    class: mechanical
    enforcement: blocking
    producer: hk and the repository record checker
    maintainer: Product-record maintainer
    consumers:
      - Requirement authors at local-fast
      - GitHub Actions and reviewers at CI before merge
    governing_rules:
      - docs/governance/record-system.md#workflows
    invariant: Each established V2 requirement identifier remains defined exactly once as an active nonempty requirement or an explicit retirement marker naming its current authority.
    runner: hk
    implementation:
      kind: hk-steps
      steps:
        local-fast:
          - record-identifiers
        ci:
          - record-identifiers
    execution_points:
      - local-fast
      - ci
    failure_mode: Requirements become ambiguous across capability modules, disappear, or remain as empty retirement placeholders.

  - id: decision-number-uniqueness
    state: current
    class: mechanical
    enforcement: blocking
    producer: hk and the repository record checker
    maintainer: Decision-record maintainer
    consumers:
      - Decision authors at local-fast
      - GitHub Actions and reviewers at CI before merge
    governing_rules:
      - docs/governance/record-system.md#decision-record-numbers
    invariant: Each decision record number and file prefix is unique.
    runner: hk
    implementation:
      kind: hk-steps
      steps:
        local-fast:
          - record-identifiers
        ci:
          - record-identifiers
    execution_points:
      - local-fast
      - ci
    failure_mode: Durable decisions cannot be referenced unambiguously.

  - id: record-family-path-consistency
    state: current
    class: mechanical
    enforcement: blocking
    producer: hk and the repository record checker
    maintainer: Record-system maintainer
    consumers:
      - Record authors and reviewers at local-fast and CI
    governing_rules:
      - docs/governance/governance-system.md#gov-002-one-canonical-authority
      - docs/governance/record-system.md#authority-by-concern
    invariant: Current record-family paths exist, governed records match one declared family, and the documentation portal routes to every retained current record directly or, for an evidence-only file, through a portal-linked structured record that references its path.
    runner: hk
    implementation:
      kind: hk-steps
      steps:
        local-fast:
          - record-family-path-consistency
        ci:
          - record-family-path-consistency
    execution_points:
      - local-fast
      - ci
    failure_mode: A canonical record is orphaned, duplicated, or omitted from review routing.

  - id: generated-global-json
    state: current
    class: mechanical
    enforcement: blocking
    producer: hk and pkl
    maintainer: Control maintainer
    consumers:
      - Contributors at local-fast before commit
      - GitHub Actions and reviewers at CI before merge
    governing_rules:
      - docs/governance/governance-system.md#gov-002-one-canonical-authority
      - CONTRIBUTING.md#net-and-agent-tooling
    invariant: >-
      global.json is byte-identical to the evaluation of global.pkl, which derives the
      .NET SDK version from the http:dotnet-development entry in mise.lock.
    runner: hk
    implementation:
      kind: hk-steps
      steps:
        local-fast:
          - global-json
        ci:
          - global-json
    execution_points:
      - local-fast
      - ci
    failure_mode: global.json is edited by hand or left stale after an SDK change, so dotnet selects an SDK other than the one mise installs and locks.

  - id: secret-shape
    state: current
    class: mechanical
    enforcement: blocking
    producer: hk and gitleaks
    maintainer: Security maintainer
    consumers:
      - Contributors at local-fast before commit
      - GitHub Actions and reviewers at CI before merge
    governing_rules:
      - docs/governance/project.md
      - docs/research/experiment-safety.md
    invariant: Committed content does not match configured credential or secret patterns.
    runner: hk
    implementation:
      kind: hk-steps
      steps:
        local-fast:
          - gitleaks
        ci:
          - gitleaks
          - gitleaks-history
    execution_points:
      - local-fast
      - ci
    failure_mode: Credentials or private experimental data enter Git history.

  - id: github-workflow-validation
    state: current
    class: mechanical
    enforcement: blocking
    producer: hk and actionlint
    maintainer: Control maintainer
    consumers:
      - GitHub Actions maintainers and reviewers at CI
    governing_rules:
      - docs/governance/governance-system.md#gov-005-controls-implement-policy
    invariant: GitHub Actions workflows satisfy their published syntax and expression contracts.
    runner: hk
    implementation:
      kind: hk-steps
      steps:
        ci:
          - actionlint
    execution_points:
      - ci
    failure_mode: The repository merges a workflow that cannot execute its declared checks.

  - id: linux-scenario-tests
    state: current
    class: mechanical
    enforcement: blocking
    producer: GitHub Actions Linux Scenario Tests job
    maintainer: Control maintainer
    consumers:
      - GitHub Actions and reviewers at CI before merge
    governing_rules:
      - docs/governance/governance-system.md#gov-005-controls-implement-policy
      - docs/validation/strategy.md#test-design-and-evidence-selection
      - docs/product/requirements/quality-build-and-validation.md#v2-req-053-public-build-chain
      - docs/validation/strategy.md#continuous-integration-and-host-timing-evidence
    invariant: >-
      Every pull request and main-v2 push restores Linux.slnx from public package
      sources only, builds it, and passes every platform-neutral
      tests/Authentication.Scenarios scenario. Windows projects, Windows host-timing
      evidence and real-account behavior are outside this control.
    runner: github-platform
    implementation:
      kind: repository-path
      value: .github/workflows/check.yml
    execution_points:
      - ci
    failure_mode: A core, contract or scenario change merges without its platform-neutral scenarios compiling or passing.

  - id: windows-build-and-scenarios
    state: current
    class: mechanical
    enforcement: blocking
    producer: GitHub Actions Windows Build on Linux and Windows Scenario Tests jobs
    maintainer: Control maintainer
    consumers:
      - GitHub Actions and reviewers at CI before merge
    governing_rules:
      - docs/governance/governance-system.md#gov-005-controls-implement-policy
      - docs/validation/strategy.md#test-design-and-evidence-selection
      - docs/product/requirements/quality-build-and-validation.md#v2-req-053-public-build-chain
      - docs/validation/strategy.md#continuous-integration-and-host-timing-evidence
    invariant: >-
      Every pull request and main-v2 push restores Windows.slnx from public package
      sources only and builds it on Linux with Windows targeting, and on a GitHub-hosted
      windows-latest runner restores and builds it and passes every
      tests/Authentication.Windows.Scenarios scenario outside the WindowsHostTiming
      category. Windows host-timing evidence, published-executable scenarios, real
      accounts, WAM UI and broker sign-in are outside this control.
    runner: github-platform
    implementation:
      kind: repository-path
      value: .github/workflows/check.yml
    execution_points:
      - ci
    failure_mode: A Windows adapter, CLI or Windows scenario change merges without compiling, or with a synthetic Windows scenario failing, because only the platform-neutral projects ran in CI.

  - id: record-system-review
    state: current
    class: procedural-review
    enforcement: review-required
    producer: Reviewer independent of the change author and implementation agent
    maintainer: Record-system maintainer
    consumers:
      - Change author and repository owner during pull-request and Delivery Wave review
    governing_rules:
      - docs/governance/governance-system.md
      - docs/governance/record-system.md
    invariant: Changed record families and current work authorization retain one authority, real consumers, bounded lifecycle, and policy-aligned controls.
    runner: agent-skill
    implementation:
      kind: repository-path
      value: .github/skills/record-system-review/SKILL.md
    execution_points:
      - pull-request-review
    failure_mode: A syntactically valid change creates duplicated authority or unmaintainable governance.

  - id: research-evidence-review
    state: current
    class: procedural-review
    enforcement: review-required
    producer: Reviewer independent of the change author and implementation agent
    maintainer: Research maintainer
    consumers:
      - Change author and repository owner during research, every Delivery Wave change, recheck-trigger, and release review
    governing_rules:
      - docs/research/experiment-safety.md
      - docs/governance/record-system.md
    invariant: Research changes preserve source boundaries, bounded effects, accepted protocols, evidence labels, reproducibility, and claim limits; every merged Delivery Wave change and fired trigger evaluates the current recheck registry.
    runner: agent-skill
    implementation:
      kind: repository-path
      value: .github/skills/research-evidence-review/SKILL.md
    execution_points:
      - pull-request-review
      - recheck-trigger
      - release
    failure_mode: Research conclusions overstate evidence or expose unsafe experimental detail.

  - id: independent-finding-triage
    state: current
    class: procedural-review
    enforcement: review-required
    producer: Reviewer independent of the originating review, change author, and implementation agent
    maintainer: Repository owner
    consumers:
      - Change author and repository owner before remediation or disposition
    governing_rules:
      - docs/governance/governance-system.md#gov-011-separate-findings-from-disposition
    invariant: A reviewer does not solely validate or dismiss its own material findings.
    runner: agent-skill
    implementation:
      kind: review-procedure
      value: Material-finding triage instructions in each active review Skill
    execution_points:
      - pull-request-review
      - recheck-trigger
      - release
    failure_mode: A self-confirming review creates false assurance or unnecessary changes.

  - id: record-system-gate
    state: current
    class: owner-decision
    enforcement: owner-disposition
    producer: Repository owner
    maintainer: Repository owner
    consumers:
      - Repository owner at the applicable pull-request merge
    governing_rules:
      - docs/governance/record-system.md#record-system-gate
      - docs/governance/governance-system.md#gov-010-gates-require-evidence
    invariant: A record-system or work-authorization change is accepted only after its required mechanical and contextual evidence is reviewable.
    runner: human-owner
    implementation:
      kind: evidence-carrier
      value: Applicable pull request, check results, review records, and owner disposition
    execution_points:
      - pull-request-merge
    failure_mode: The repository accepts changed authority or work authorization without evidence that its records and controls agree.
