schema_version: 1

families:
  - id: public-landing
    state: current
    concern: Public navigation to canonical project records
    carrier: repository-file
    path: README.md
    format: markdown
    producer: Repository owner
    maintainer: Repository owner
    consumers:
      - Public readers evaluating the project
    creation_trigger: The repository is presented as a distinct public project.
    failure_mode: Readers cannot locate current identity, purpose, scope, or release authorities.
    review_point: Pull requests that change public navigation or required notices

  - id: human-record-portal
    state: current
    concern: Human navigation to canonical project records
    carrier: repository-file
    path: docs/README.md
    format: markdown
    producer: Record-system maintainer
    maintainer: Record-system maintainer
    consumers:
      - Contributors locating the authority for a concern
    creation_trigger: Canonical concerns span more than the public landing page.
    failure_mode: Contributors rely on stale or duplicate records.
    review_point: Pull requests that add, move, or remove canonical records

  - id: agent-interface
    state: current
    concern: AI-agent repository behavior and stop conditions
    carrier: repository-file
    path: AGENTS.md
    format: markdown
    producer: Repository owner
    maintainer: Repository owner
    consumers:
      - AI agents before repository work
    creation_trigger: AI agents are permitted to act on the repository.
    failure_mode: Agents infer authority, expose sensitive data, or expand scope.
    review_point: Pull requests that change agent-relevant policy or workflow

  - id: contributor-interface
    state: current
    concern: Human contribution workflow
    carrier: repository-file
    path: CONTRIBUTING.md
    format: markdown
    producer: Repository owner
    maintainer: Repository owner
    consumers:
      - Human contributors preparing changes
    creation_trigger: The repository accepts reviewable contributions.
    failure_mode: Contributions bypass required records, checks, or review.
    review_point: Pull requests that change contribution workflow

  - id: pull-request-interface
    state: current
    concern: Non-authoritative pull-request prompts for scope, evidence, and record impact
    carrier: repository-file
    path: .github/pull_request_template.md
    format: markdown
    producer: Record-system maintainer
    maintainer: Record-system maintainer
    consumers:
      - Contributors preparing a pull request
    creation_trigger: Pull requests need consistent prompts for existing governance obligations.
    failure_mode: Review begins without the scope, evidence, or record impact needed by current policies.
    review_point: Pull requests that change contribution or review workflow

  - id: upstream-policy
    state: current
    concern: Upstream relationship, provenance, and import boundaries
    carrier: repository-file
    path: UPSTREAM.md
    format: markdown
    producer: Repository owner
    maintainer: Repository owner
    consumers:
      - Maintainers evaluating upstream evidence or imports
    creation_trigger: The project derives from an upstream repository.
    failure_mode: Upstream provenance or compatibility is misrepresented.
    review_point: Pull requests that import or reinterpret upstream material

  - id: project-state
    state: current
    concern: Current stage and work authorization
    carrier: repository-file
    path: docs/project-state.md
    format: markdown
    producer: Repository owner
    maintainer: Repository owner
    consumers:
      - Contributors and agents before starting work
    creation_trigger: Work must remain inside an explicitly authorized stage and issue.
    failure_mode: Work begins outside the accepted stage or scope.
    review_point: Every phase transition and work-authorization change

  - id: roadmap
    state: current
    concern: Durable stage model and exit gates
    carrier: repository-file
    path: docs/roadmap.md
    format: markdown
    producer: Repository owner
    maintainer: Repository owner
    consumers:
      - Maintainers planning stage transitions
    creation_trigger: The project requires more than one bounded delivery stage.
    failure_mode: Work order or exit criteria are inferred from transient issue state.
    review_point: Pull requests that change the stage model or exit gates

  - id: governance-policy
    state: current
    concern: Durable project and record governance policies
    carrier: repository-files
    path: docs/governance/*.md
    format: markdown
    producer: Repository owner
    maintainer: Repository owner
    consumers:
      - Contributors, agents, reviewers, and controls applying governance rules
    creation_trigger: A stable governance concern needs independent authority.
    failure_mode: Interfaces or controls create undeclared or conflicting policy.
    review_point: Pull requests that change governance, records, or controls

  - id: record-family-catalog
    state: current
    concern: Active and scheduled record-family routing
    carrier: repository-file
    path: docs/governance/record-families.yaml
    format: yaml
    schema: schemas/governance/record-families.schema.json
    producer: Record-system maintainer
    maintainer: Record-system maintainer
    consumers:
      - hk path checks and reviewer routing
    creation_trigger: Record families require consistent paths and review procedures.
    failure_mode: Records become orphaned or receive the wrong checks and reviews.
    review_point: Pull requests that add, retire, or change a record family

  - id: control-catalog
    state: current
    concern: Controls that implement declared policies and invariants
    carrier: repository-file
    path: docs/governance/controls.yaml
    format: yaml
    schema: schemas/governance/controls.schema.json
    producer: Control maintainer
    maintainer: Control maintainer
    consumers:
      - The repository checker under hk when validating control wiring, reviewer agents when routing review, and the repository owner at gates
    creation_trigger: More than one control class must be routed consistently.
    failure_mode: Controls drift from policy or execute at the wrong gate.
    review_point: Pull requests that add, retire, or change a control

  - id: operational-identity-registry
    state: current
    concern: Separation from upstream operational identifiers
    carrier: repository-file
    path: docs/governance/operational-identities.yaml
    format: yaml
    schema: schemas/governance/operational-identities.schema.json
    producer: Architecture and release maintainers
    maintainer: Repository owner
    consumers:
      - Architecture, implementation, packaging, cache, telemetry, and release maintainers when selecting or consuming an identity
    creation_trigger: The fork must coexist without impersonating or mutating upstream state.
    failure_mode: The project collides with or appears to be the upstream product.
    review_point: Pull requests that select or consume an operational identity

  - id: product-vision
    state: current
    concern: Product purpose and boundary
    carrier: repository-file
    path: docs/product/vision.md
    format: markdown
    producer: Repository owner
    maintainer: Repository owner
    consumers:
      - Requirement authors, architecture maintainers, and the repository owner when defining or reviewing product scope
    creation_trigger: The project needs a durable product boundary.
    failure_mode: Requirements or implementation expand without a product basis.
    review_point: Pull requests that change product purpose or scope

  - id: compatibility-policy
    state: current
    concern: Current compatibility and migration commitments
    carrier: repository-file
    path: docs/product/compatibility-and-migration.md
    format: markdown
    producer: Repository owner
    maintainer: Repository owner
    consumers:
      - Requirement, architecture, validation, and release maintainers when evaluating compatibility or migration commitments
    creation_trigger: Compatibility posture must be distinguished from upstream behavior.
    failure_mode: Internal reuse or observed behavior becomes an accidental support promise.
    review_point: Pull requests that change a compatibility or migration commitment

  - id: product-requirements
    state: current
    concern: Capability-scoped required behavior
    carrier: repository-files
    path: docs/product/requirements/*.md
    format: markdown
    producer: Repository owner with engineering input
    maintainer: Repository owner
    consumers:
      - Architecture, design, implementation, and validation owners when deriving or reviewing required behavior
    creation_trigger: A capability has independently reviewable required behavior.
    failure_mode: Behavior is implemented or tested without an accepted requirement.
    review_point: Pull requests that add or change product behavior

  - id: architecture-records
    state: current
    concern: Current system structure, boundaries, and invariants
    carrier: repository-files
    path: docs/architecture/*.md
    format: markdown
    producer: Architecture maintainer
    maintainer: Architecture maintainer
    consumers:
      - Design, implementation, security, and validation owners when applying system boundaries or invariants
    creation_trigger: A system-wide or independently reviewable architecture concern exists.
    failure_mode: Implementations adopt incompatible boundaries or ownership.
    review_point: Pull requests that change system structure or architecture invariants

  - id: decision-records
    state: current
    concern: Durable high-cost choices and rationale
    carrier: repository-files
    path: docs/decisions/[0-9][0-9][0-9][0-9]-*.md
    format: markdown
    producer: Decision owner
    maintainer: Repository owner
    consumers:
      - Maintainers revisiting choices with material reversal cost
    creation_trigger: A durable choice has high reversal cost or non-obvious rationale.
    failure_mode: A future change repeats settled analysis or violates a foundational choice.
    review_point: Pull requests that introduce or reverse a qualifying decision

  - id: v1-architecture-audit
    state: current
    concern: Public evidence for rejecting the v1 core as the v2 foundation
    carrier: repository-file
    path: docs/research/v1-architecture-audit.md
    format: markdown
    producer: Researcher
    maintainer: Research maintainer
    consumers:
      - Architecture and implementation maintainers when evaluating whether v1 structure can be reused
    creation_trigger: The inherited implementation is evaluated as a possible foundation.
    failure_mode: v2 reuses unsafe or unsuitable v1 structure without evidence.
    review_point: Pull requests that rely on or materially revise the v1 audit

  - id: experiment-safety
    state: current
    concern: Isolation, evidence classification, and stop conditions for experiments
    carrier: repository-file
    path: docs/research/experiment-safety.md
    format: markdown
    producer: Security and research maintainers
    maintainer: Repository owner
    consumers:
      - Anyone proposing or running an experiment
    creation_trigger: Repository work may observe build, authentication, cache, or host behavior.
    failure_mode: Experiments expose credentials, mutate state, or overstate observations.
    review_point: Every experiment protocol and every change to experiment policy

  - id: public-source-rechecks
    state: current
    concern: Mutable public facts that can change a current conclusion
    carrier: repository-file
    path: docs/research/rechecks.yaml
    format: yaml
    schema: schemas/research/rechecks.schema.json
    producer: Researcher
    maintainer: Research maintainer
    consumers:
      - Research reviewers at every phase transition and when a recorded trigger fires
    creation_trigger: A mutable public source could materially change a current conclusion.
    failure_mode: A decision continues to rely on stale public behavior or guidance.
    review_point: Recorded trigger events and every phase transition

  - id: threat-model
    state: current
    concern: Security assumptions, assets, threats, and trust boundaries
    carrier: repository-file
    path: docs/security/threat-model.md
    format: markdown
    producer: Security and architecture maintainers
    maintainer: Repository owner
    consumers:
      - Architecture, design, implementation, experiment, and release reviewers when evaluating security effects
    creation_trigger: The project handles credentials, tokens, caches, or external identity systems.
    failure_mode: Security controls address the wrong assets or trust boundaries.
    review_point: Pull requests that change assets, trust boundaries, or security posture

  - id: security-interface
    state: current
    concern: Public vulnerability-reporting boundary
    carrier: repository-file
    path: SECURITY.md
    format: markdown
    producer: Repository owner
    maintainer: Repository owner
    consumers:
      - Security reporters choosing a public or private channel
    creation_trigger: The public repository may receive vulnerability reports.
    failure_mode: Sensitive reports are disclosed publicly or sent to the wrong project.
    review_point: Pull requests that change reporting channels or support posture

  - id: validation-strategy
    state: current
    concern: Evidence required for behavior and support claims
    carrier: repository-file
    path: docs/validation/strategy.md
    format: markdown
    producer: Validation maintainer
    maintainer: Repository owner
    consumers:
      - Requirement authors, implementers, and release reviewers when selecting evidence for a claim
    creation_trigger: Claims require consistent validation depth and evidence carriers.
    failure_mode: Passing checks are mistaken for unsupported real-platform claims.
    review_point: Pull requests that change claim scope or validation obligations

  - id: structured-record-schemas
    state: current
    concern: Machine contracts for structured repository records
    carrier: repository-files
    path: schemas/**/*.schema.json
    format: json-schema
    producer: Structured-record maintainer
    maintainer: Structured-record maintainer
    consumers:
      - hk schema validation and record authors
    creation_trigger: A structured record needs deterministic validation.
    failure_mode: Structured records become ambiguous or silently incompatible with consumers.
    review_point: Pull requests that add or change a structured record

  - id: public-contracts
    state: scheduled
    concern: Versioned public request, result, and process contracts
    carrier: repository-files
    path: contracts/**/*.schema.json
    format: json-schema
    producer: Contract maintainer
    maintainer: Contract maintainer
    consumers:
      - Implementation owners, protocol-adapter maintainers, and validation reviewers when consuming a public contract
    creation_trigger: Contract and Architecture work is authorized for a bounded interface.
    failure_mode: Consumers depend on undocumented or unstable wire behavior.
    review_point: Contract freeze and every compatible or breaking contract change
    activation:
      trigger: A Phase 2 issue authorizes a public contract boundary.
      evaluator: Repository owner
      action: Create the versioned contract, schema checks, and applicable review procedure.
      fallback_review: Every transition into or out of Contract and Architecture

  - id: design-records
    state: scheduled
    concern: Implementation-boundary design requiring independent review
    carrier: repository-files
    path: designs/*.md
    format: markdown
    producer: Implementation owner
    maintainer: Implementation owner
    consumers:
      - Implementers and reviewers of the bounded subsystem
    creation_trigger: A coherent implementation boundary needs review beyond current architecture.
    failure_mode: Material implementation choices remain implicit or fragmented across pull requests.
    review_point: Before implementation of the bounded design
    activation:
      trigger: An authorized implementation issue meets the design creation trigger.
      evaluator: Architecture maintainer
      action: Create the design record and activate design review routing.
      fallback_review: Every transition into Incremental Implementation and Validation

  - id: public-build-source-baseline
    state: current
    concern: Fixed solution targets, source-declared direct dependencies, and stage applicability for the issue #1 audited upstream commit
    carrier: repository-file
    path: docs/research/public-build-source-baseline.json
    format: json
    schema: schemas/research/public-build-source-baseline.schema.json
    producer: Public-source auditor
    maintainer: Research maintainer
    consumers:
      - Issue #1 experiment authors and the repository checker when constructing or validating dependency evidence
      - Research reviewers when comparing runtime records with the fixed upstream source
    creation_trigger: The issue #2 owner disposition authorizes the immutable public-source audit for the issue #1 fixed commit before runtime experiment activation.
    failure_mode: Experiment authors must reconstruct target and dependency identity from an opaque hash or omit a source-declared build input.
    review_point: Changes that correct the fixed source audit or change the issue #1 audited commit

  - id: public-build-lasso-reference-manifest
    state: current
    concern: Fixed source-level Microsoft.Office.Lasso usage locations for issue #1 responsibility analysis
    carrier: repository-file
    path: docs/research/public-build-lasso-reference-manifest.json
    format: json
    schema: schemas/research/public-build-lasso-reference-manifest.schema.json
    producer: Public-source auditor
    maintainer: Research maintainer
    consumers:
      - Issue #1 experiment authors mapping every Lasso source usage to an apparent responsibility
      - The repository checker and research reviewers validating coverage
    creation_trigger: The issue #2 owner disposition authorizes the immutable public-source audit, and text-only package-name search omitted unqualified symbols imported from Lasso namespaces.
    failure_mode: Lasso responsibility analysis can omit operational call sites while still matching an incomplete hash.
    review_point: Changes that correct source-reference attribution or change the issue #1 audited commit

  - id: public-build-experiment-bundles
    state: scheduled
    concern: Reviewed planned protocols for issue #1 public-build experiments, followed by runner-produced evidence only after runtime activation
    carrier: repository-files
    path: docs/research/experiments/public-build-*.yaml
    format: yaml
    schema: schemas/research/public-build-experiment-bundle.schema.json
    producer: Experiment owner
    maintainer: Research maintainer
    consumers:
      - Issue #1 experiment authors when preparing the activation review
      - Issue #1 implementers and research reviewers after activation when reproducing commands or evaluating dependency and public-build conclusions
    creation_trigger: After the Runtime Activation Prerequisites in docs/research/experiment-safety.md are recorded as satisfied and non-executing environment discovery is complete, before the experiment selection root is created or the first issue #1 experiment command is executed.
    failure_mode: A runtime experiment begins without a reviewed source binding, exact toolchain and runner identity, bounded command topology, or isolation and evidence plan.
    review_point: Before execution and when conclusions are recorded
    activation:
      trigger: The Runtime Activation Prerequisites in docs/research/experiment-safety.md are recorded as satisfied, non-executing environment discovery is complete, and the reviewed protocol is ready for activation.
      evaluator: Research maintainer, using the repository owner's recorded Record-System Gate disposition and the target branch's accepted project state
      action: Pin the reviewed exact .NET 8 SDK in mise.toml under an isolated mise data root; add the LF-normalized repository-owned direct-spawn runner and its synthetic conformance fixtures; expand or replace the planned-only schema with the runner-produced runtime contract, change its machine-readable marker to runtime, and bind each required runtime semantic to a distinct marked property under a required runtime-evidence root; require one canonical termination cause with optional structured detail and define the minimum receipt hash only after selecting the raw or embedded receipt carrier; require build, test, and package commands to use --no-restore after the corresponding restore succeeds; define independent resolved or unresolved evidence for applicable package-backed assemblies; prove process-tree quiescence on normal exit, failure, cancellation, and timeout, including the case where a parent exits normally while a grandchild remains alive; prohibit destructive cleanup or root release when quiescence is unproved; add the blocking public-build-runner-conformance HK step at local-fast and CI; create the initial planned bundle; change this family and its evidence control to current in the same change; and validate the protocol before creating the selection root or executing dotnet.
      fallback_review: Issue #1 closure and every phase transition while issue #1 remains open

  - id: public-build-assets-evidence
    state: scheduled
    concern: Sanitized project.assets.json inputs retained for reproducible issue #1 dependency projections
    carrier: repository-files
    path: docs/research/experiments/assets/*.project.assets.json
    format: json
    schema: schemas/research/public-build-assets-evidence.schema.json
    producer: Experiment owner
    maintainer: Research maintainer
    consumers:
      - The issue #1 assets extractor and repository checker when reproducing complete or partial dependency projections
      - Research reviewers validating project, runtime, package, and source claims against retained restore evidence
    creation_trigger: An issue #1 restore produces a project.assets.json used by a recorded complete or partial dependency projection.
    failure_mode: A projection can remain internally consistent while omitting or misattributing topology from the restore artifact it claims to represent.
    review_point: With each retained assets file and before its referencing experiment bundle is completed
    activation:
      trigger: The first sanitized project.assets.json evidence file is ready to commit.
      evaluator: Research maintainer
      action: Add the first evidence file and change this family to current in the same commit.
      fallback_review: Issue #1 closure and every phase transition while issue #1 remains open

  - id: validation-cases
    state: scheduled
    concern: Reusable validation scenarios and expected evidence
    carrier: repository-files
    path: docs/validation/cases/*.md
    format: markdown
    producer: Validation maintainer
    maintainer: Validation maintainer
    consumers:
      - Implementers, reviewers, and release qualification
    creation_trigger: A behavior or claim needs a stable reusable validation scenario.
    failure_mode: Validation depends on transient commands or undocumented expectations.
    review_point: Before a scenario becomes a release or support gate
    activation:
      trigger: A requirement or contract has a reusable scenario not covered by an existing record.
      evaluator: Validation maintainer
      action: Create the case and bind its execution evidence to the applicable gate.
      fallback_review: Every transition into Incremental Implementation and Validation
